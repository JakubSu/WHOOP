info:
  name: getCycleById
  type: http
  seq: 1
  tags:
    - Cycle

http:
  method: GET
  url: "{{baseUrl}}/v2/cycle/:cycleId"
  params:
    - name: cycleId
      value: ""
      type: path
      description: ID of the cycle to retrieve
  auth:
    type: oauth2
    flow: authorization_code
    authorizationUrl: "{{oauth_auth_url}}"
    accessTokenUrl: "{{oauth_token_url}}"
    refreshTokenUrl: "{{oauth_token_url}}"
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
      clientSecret: "{{oauth_client_secret}}"
      placement: body
    scope: "{{oauth_scopes}}"
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

