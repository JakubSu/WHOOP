opencollection: 1.0.0

info:
  name: WHOOP API
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: oauth2
    flow: authorization_code
    authorizationUrl: "{{oauth_auth_url}}"
    accessTokenUrl: "{{oauth_token_url}}"
    refreshTokenUrl: "{{oauth_token_url}}"
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
      clientSecret: "{{oauth_client_secret}}"
      placement: body
    scope: "{{oauth_scopes}}"
    state: "{{oauth_state}}"
    pkce:
      disabled: true
    tokenConfig:
      id: WHOOP Access Token
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: true
      autoRefreshToken: true
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
