info:
  name: getRecoveryCollection
  type: http
  seq: 1
  tags:
    - Recovery

http:
  method: GET
  url: "{{baseUrl}}/v2/recovery"
  params:
    - name: limit
      value: "10"
      type: query
      description: Limit on the number of recoveries returned
    - name: start
      value: ""
      type: query
      description: Return recoveries that occurred after or during (inclusive) this time. If not specified, the response will not filter recoveries by a minimum time.
      disabled: true
    - name: end
      value: ""
      type: query
      description: Return recoveries that intersect this time or ended before (exclusive) this time. If not specified, `end` will be set to `now`.
      disabled: true
    - name: nextToken
      value: ""
      type: query
      description: Optional next token from the previous response to get the next page. If not provided, the first page in the collection is returned
      disabled: true
  auth:
    type: oauth2
    flow: authorization_code
    authorizationUrl: "{{oauth_auth_url}}"
    accessTokenUrl: "{{oauth_token_url}}"
    refreshTokenUrl: "{{oauth_token_url}}"
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
      clientSecret: "{{oauth_client_secret}}"
      placement: body
    scope: "{{oauth_scopes}}"
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

