info:
  name: Get User Body Measurements
  type: http
  seq: 1
  tags:
    - User

http:
  method: GET
  url: "{{baseUrl}}/v2/user/measurement/body"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successfully retrieved body measurements
    request:
      url: "{{baseUrl}}/v2/user/measurement/body"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "height_meter": 1.8288,
            "weight_kilogram": 90.7185,
            "max_heart_rate": 200
          }
  - name: 401 Response
    description: Invalid authorization
    request:
      url: "{{baseUrl}}/v2/user/measurement/body"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: text
        data: ""
  - name: 404 Response
    description: Requested resource not found
    request:
      url: "{{baseUrl}}/v2/user/measurement/body"
      method: GET
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: ""
  - name: 429 Response
    description: Request rejected due to rate limiting
    request:
      url: "{{baseUrl}}/v2/user/measurement/body"
      method: GET
    response:
      status: 429
      statusText: Too Many Requests
      body:
        type: text
        data: ""
  - name: 500 Response
    description: Server error occurred while making request
    request:
      url: "{{baseUrl}}/v2/user/measurement/body"
      method: GET
    response:
      status: 500
      statusText: Internal Server Error
      body:
        type: text
        data: ""
