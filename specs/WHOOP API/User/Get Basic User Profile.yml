info:
  name: Get Basic User Profile
  type: http
  seq: 2
  tags:
    - User

http:
  method: GET
  url: "{{baseUrl}}/v2/user/profile/basic"
  auth:
    type: oauth2
    flow: authorization_code
    authorizationUrl: "{{oauth_auth_url}}"
    accessTokenUrl: "{{oauth_token_url}}"
    refreshTokenUrl: "{{oauth_token_url}}"
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
      clientSecret: "{{oauth_client_secret}}"
      placement: body
    scope: "{{oauth_scopes}}"
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successfully retrieved user profile
    request:
      url: "{{baseUrl}}/v2/user/profile/basic"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "user_id": 10129,
            "email": "jsmith123@whoop.com",
            "first_name": "John",
            "last_name": "Smith"
          }
  - name: 401 Response
    description: Invalid authorization
    request:
      url: "{{baseUrl}}/v2/user/profile/basic"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: text
        data: ""
  - name: 404 Response
    description: Requested resource not found
    request:
      url: "{{baseUrl}}/v2/user/profile/basic"
      method: GET
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: ""
  - name: 429 Response
    description: Request rejected due to rate limiting
    request:
      url: "{{baseUrl}}/v2/user/profile/basic"
      method: GET
    response:
      status: 429
      statusText: Too Many Requests
      body:
        type: text
        data: ""
  - name: 500 Response
    description: Server error occurred while making request
    request:
      url: "{{baseUrl}}/v2/user/profile/basic"
      method: GET
    response:
      status: 500
      statusText: Internal Server Error
      body:
        type: text
        data: ""
