info:
  name: Create diagnostic report results for a service request
  type: http
  seq: 7
  tags:
    - Partner

http:
  method: POST
  url: "{{baseUrl}}/v2/partner/service-request/:id/results"
  params:
    - name: id
      value: ""
      type: path
      description: Unique identifier of the service request
  body:
    type: json
    data: |-
      {
        "status": "",
        "observations": [
          {
            "value_numeric": 0,
            "value_text": "",
            "unit": "",
            "status": "",
            "code": ""
          }
        ]
      }
  auth:
    type: oauth2
    flow: client_credentials
    accessTokenUrl: "{{partner_token_url}}"
    refreshTokenUrl: "{{partner_token_url}}"
    credentials:
      clientId: "{{partner_client_id}}"
      clientSecret: "{{partner_client_secret}}"
      placement: body
    scope: "{{partner_scope}}"
    tokenConfig:
      placement:
        header: Bearer
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Response
    description: Diagnostic report created successfully
    request:
      url: "{{baseUrl}}/v2/partner/service-request/:id/results"
      method: POST
      params:
        - name: id
          value: ""
          type: path
          description: Unique identifier of the service request
      body:
        type: json
        data: |-
          {
            "status": "",
            "observations": [
              {
                "value_numeric": 0,
                "value_text": "",
                "unit": "",
                "status": "",
                "code": ""
              }
            ]
          }
    response:
      status: 201
      statusText: Created
      body:
        type: text
        data: ""
  - name: 404 Response
    description: Service request not found or partner is not an owner
    request:
      url: "{{baseUrl}}/v2/partner/service-request/:id/results"
      method: POST
      params:
        - name: id
          value: ""
          type: path
          description: Unique identifier of the service request
      body:
        type: json
        data: |-
          {
            "status": "",
            "observations": [
              {
                "value_numeric": 0,
                "value_text": "",
                "unit": "",
                "status": "",
                "code": ""
              }
            ]
          }
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: ""
