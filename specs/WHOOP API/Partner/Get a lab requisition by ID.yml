info:
  name: Get a lab requisition by ID
  type: http
  seq: 2
  tags:
    - Partner

http:
  method: GET
  url: "{{baseUrl}}/v2/partner/requisition/:id"
  params:
    - name: id
      value: ""
      type: path
      description: Unique identifier of the lab requisition
  auth:
    type: oauth2
    flow: client_credentials
    accessTokenUrl: "{{partner_token_url}}"
    refreshTokenUrl: "{{partner_token_url}}"
    credentials:
      clientId: "{{partner_client_id}}"
      clientSecret: "{{partner_client_secret}}"
      placement: body
    scope: "{{partner_scope}}"
    tokenConfig:
      placement:
        header: Bearer
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Lab requisition found
    request:
      url: "{{baseUrl}}/v2/partner/requisition/:id"
      method: GET
      params:
        - name: id
          value: ""
          type: path
          description: Unique identifier of the lab requisition
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "created_at": "",
            "updated_at": "",
            "service_requests": [
              {
                "id": "",
                "status": "",
                "intent": "",
                "code": "",
                "task_business_status": "",
                "task_description": ""
              }
            ],
            "patient": {
              "id": ""
            },
            "appointments": [
              {
                "service_request_ids": [],
                "start_time": ""
              }
            ]
          }
  - name: 404 Response
    description: Lab requisition not found or partner is not an owner
    request:
      url: "{{baseUrl}}/v2/partner/requisition/:id"
      method: GET
      params:
        - name: id
          value: ""
          type: path
          description: Unique identifier of the lab requisition
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: ""
