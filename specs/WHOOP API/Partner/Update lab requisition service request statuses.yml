info:
  name: Update lab requisition service request statuses
  type: http
  seq: 5
  tags:
    - Partner

http:
  method: PATCH
  url: "{{baseUrl}}/v2/partner/requisition/:id/status"
  params:
    - name: id
      value: ""
      type: path
      description: Unique identifier of the lab requisition
  body:
    type: json
    data: |-
      {
        "task_business_status": "",
        "reason": ""
      }
  auth:
    type: oauth2
    flow: client_credentials
    accessTokenUrl: "{{partner_token_url}}"
    refreshTokenUrl: "{{partner_token_url}}"
    credentials:
      clientId: "{{partner_client_id}}"
      clientSecret: "{{partner_client_secret}}"
      placement: body
    scope: "{{partner_scope}}"
    tokenConfig:
      placement:
        header: Bearer
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 204 Response
    description: Service request statuses updated successfully
    request:
      url: "{{baseUrl}}/v2/partner/requisition/:id/status"
      method: PATCH
      params:
        - name: id
          value: ""
          type: path
          description: Unique identifier of the lab requisition
      body:
        type: json
        data: |-
          {
            "task_business_status": "",
            "reason": ""
          }
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
  - name: 404 Response
    description: Lab requisition not found or partner is not an owner
    request:
      url: "{{baseUrl}}/v2/partner/requisition/:id/status"
      method: PATCH
      params:
        - name: id
          value: ""
          type: path
          description: Unique identifier of the lab requisition
      body:
        type: json
        data: |-
          {
            "task_business_status": "",
            "reason": ""
          }
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: ""
