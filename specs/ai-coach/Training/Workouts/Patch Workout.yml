info:
  name: "Patch Workout"
  type: "http"
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/workouts/{{workoutId}}/"
  headers:
    - name: "Content-Type"
      value: "application/json"
  body:
    type: "json"
    data: |-
      {
        "expected_time": 50
      }
  auth: "inherit"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
