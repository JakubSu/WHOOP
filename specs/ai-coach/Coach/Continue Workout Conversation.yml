info:
  name: Continue Workout Conversation
  type: http
  seq: 5
  tags:
    - Coach

http:
  method: POST
  url: "{{baseUrl}}/coach/turns/stream/"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: text/event-stream
  body:
    type: json
    data: |-
      {
        "conversation_id": "{{coachConversationId}}",
        "page_context": {
          "page_type": "workout",
          "context_id": "{{workoutId}}"
        },
        "message": "Can you explain that in simpler terms?"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: SSE Response
    description: Continues an existing workout coach conversation.
    request:
      url: "{{baseUrl}}/coach/turns/stream/"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
        - name: Accept
          value: text/event-stream
      body:
        type: json
        data: |-
          {
            "conversation_id": "{{coachConversationId}}",
            "page_context": {
              "page_type": "workout",
              "context_id": "{{workoutId}}"
            },
            "message": "Can you explain that in simpler terms?"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: text/event-stream
      body:
        type: text
        data: |-
          event: conversation_started
          data: {"conversation_id":"{{coachConversationId}}","page_context":{"page_type":"workout","context_id":"{{workoutId}}"}}

          event: assistant_done
          data: {"message":{"id":"{{coachMessageId}}","role":"assistant","content":"..."}}
