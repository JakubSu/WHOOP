info:
  name: "Get Recommendation"
  type: "http"
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/recommendations/{{recommendationId}}/"
  auth: "inherit"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

scripts:
  postResponse: |-
    const body = res.getBody();
    
    if (body.id) {
      bru.setEnvVar("recommendationId", body.id);
    }
    
    const recommendationOperationId = body.operations?.[0]?.id;
    if (recommendationOperationId) {
      bru.setEnvVar("recommendationOperationId", recommendationOperationId);
    }
