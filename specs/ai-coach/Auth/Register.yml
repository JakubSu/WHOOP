info:
  name: "Register"
  type: "http"
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/users/register/"
  headers:
    - name: "Content-Type"
      value: "application/json"
  body:
    type: "json"
    data: |-
      {
        "email": "athlete@example.com",
        "password": "strong-password",
        "display_name": "Athlete Name"
      }
  auth: "none"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

scripts:
  postResponse: |-
    const body = res.getBody();
    
    if (body.access) {
      bru.setEnvVar("accessToken", body.access);
    }
    
    if (body.refresh) {
      bru.setEnvVar("refreshToken", body.refresh);
    }
    
    if (body.user?.id) {
      bru.setEnvVar("userId", body.user.id);
    }
