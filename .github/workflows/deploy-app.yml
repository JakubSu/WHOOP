name: Deploy app

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: "Git branch to deploy"
        required: false
        default: "main"
      repository_url:
        description: "Repository URL the EC2 host should pull"
        required: false
        default: "https://github.com/JakubSu/WHOOP.git"

concurrency:
  group: production-app-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: Validate app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix apps/web

      - name: Build frontend
        run: npm run build --prefix apps/web

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt

      - name: Install backend dependencies
        run: pip install -r services/api/requirements.txt

      - name: Run backend tests
        working-directory: services/api
        run: python manage.py test

      - name: Validate Docker Compose config
        run: docker compose --env-file compose.env.example config

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: validate
    environment: production

    env:
      APP_DOMAIN: ${{ vars.APP_DOMAIN }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
      CADDY_ACME_EMAIL: ${{ vars.CADDY_ACME_EMAIL }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB || 'whoop_ai_coach' }}
      POSTGRES_USER: ${{ vars.POSTGRES_USER || 'whoop_ai_coach' }}
      REPOSITORY_URL: ${{ github.event.inputs.repository_url || vars.REPOSITORY_URL || 'https://github.com/JakubSu/WHOOP.git' }}
      SSM_PARAMETER_PREFIX: ${{ vars.SSM_PARAMETER_PREFIX || '/whoop-ai-coach/prod' }}
      TARGET_BRANCH: ${{ github.event.inputs.branch || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}

      - name: Validate deployment configuration
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          test -n "$APP_DOMAIN"
          test -n "$CADDY_ACME_EMAIL"
          test -n "$EC2_INSTANCE_ID"
          if [ -z "$AWS_ROLE_TO_ASSUME" ] && { [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; }; then
            echo "Either AWS_ROLE_TO_ASSUME or AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY must be configured." >&2
            exit 1
          fi

      - name: Configure AWS credentials with OIDC
        if: ${{ vars.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}

      - name: Configure AWS credentials with access keys
        if: ${{ vars.AWS_ROLE_TO_ASSUME == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Deploy with SSM Run Command
        run: |
          set -euo pipefail
          export SCRIPT_B64="$(base64 -w 0 infra/scripts/bootstrap_backend.sh)"

          python - <<'PY' > /tmp/ssm-commands.json
          import json
          import os
          import shlex

          args = [
              os.environ["APP_DOMAIN"],
              os.environ["CADDY_ACME_EMAIL"],
              os.environ["AWS_REGION"],
              os.environ["SSM_PARAMETER_PREFIX"],
              os.environ["POSTGRES_DB"],
              os.environ["POSTGRES_USER"],
              os.environ["OPENAI_MODEL"],
              os.environ["REPOSITORY_URL"],
              os.environ["TARGET_BRANCH"],
          ]
          quoted_args = " ".join(shlex.quote(arg) for arg in args)
          command = f"""set -euo pipefail
          script_path="/tmp/bootstrap_backend.sh"
          printf '%s' '{os.environ["SCRIPT_B64"]}' | base64 -d > "$script_path"
          tr -d '\\r' < "$script_path" > "${{script_path}}.unix"
          chmod +x "${{script_path}}.unix"
          sudo bash "${{script_path}}.unix" {quoted_args}
          """
          print(json.dumps({"commands": [command]}))
          PY

          COMMAND_ID="$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy WHOOP app from GitHub Actions" \
            --parameters file:///tmp/ssm-commands.json \
            --query 'Command.CommandId' \
            --output text)"

          echo "Started SSM command: $COMMAND_ID"

          for attempt in $(seq 1 120); do
            STATUS="$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)"

            case "$STATUS" in
              Success)
                break
                ;;
              Pending|InProgress|Delayed|"")
                sleep 5
                ;;
              Cancelled|TimedOut|Failed|Cancelling)
                echo "SSM command failed with status: $STATUS" >&2
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text || true
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query 'StandardErrorContent' \
                  --output text || true
                exit 1
                ;;
            esac

            if [ "$attempt" -eq 120 ]; then
              echo "Timed out waiting for SSM deployment command to finish." >&2
              exit 1
            fi
          done

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query 'StandardOutputContent' \
            --output text
