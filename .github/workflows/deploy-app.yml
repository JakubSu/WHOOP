name: Deploy app

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: "Git branch to deploy"
        required: false
        default: "main"
      repository_url:
        description: "Repository URL the EC2 host should pull"
        required: false
        default: "https://github.com/JakubSu/WHOOP.git"

concurrency:
  group: production-app-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix apps/web

      - name: Build frontend
        run: npm run build --prefix apps/web

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt

      - name: Install backend dependencies
        run: pip install -r services/api/requirements.txt

      - name: Run backend tests
        working-directory: services/api
        run: python manage.py test

      - name: Validate Docker Compose config
        run: docker compose --env-file compose.env.example config

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: validate
    environment: production

    env:
      APP_DOMAIN: ${{ vars.APP_DOMAIN }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      CADDY_ACME_EMAIL: ${{ vars.CADDY_ACME_EMAIL }}
      EC2_HOST: ${{ vars.EC2_HOST }}
      EC2_SSH_USER: ${{ vars.EC2_SSH_USER || 'ubuntu' }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB || 'whoop_ai_coach' }}
      POSTGRES_USER: ${{ vars.POSTGRES_USER || 'whoop_ai_coach' }}
      REPOSITORY_URL: ${{ github.event.inputs.repository_url || vars.REPOSITORY_URL || 'https://github.com/JakubSu/WHOOP.git' }}
      SSM_PARAMETER_PREFIX: ${{ vars.SSM_PARAMETER_PREFIX || '/whoop-ai-coach/prod' }}
      TARGET_BRANCH: ${{ github.event.inputs.branch || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}

      - name: Validate deployment configuration
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$APP_DOMAIN"
          test -n "$CADDY_ACME_EMAIL"
          test -n "$EC2_HOST"
          test -n "$EC2_SSH_PRIVATE_KEY"
          test -n "$EC2_SSH_KNOWN_HOSTS"

      - name: Configure SSH
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$EC2_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/deploy_key
          chmod 600 ~/.ssh/known_hosts

      - name: Upload deployment bootstrap
        run: |
          set -euo pipefail
          scp -i ~/.ssh/deploy_key \
            infra/scripts/bootstrap_backend.sh \
            "$EC2_SSH_USER@$EC2_HOST:/tmp/bootstrap_backend.sh"

      - name: Run remote deployment
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key "$EC2_SSH_USER@$EC2_HOST" bash -s -- \
            "$APP_DOMAIN" \
            "$CADDY_ACME_EMAIL" \
            "$AWS_REGION" \
            "$SSM_PARAMETER_PREFIX" \
            "$POSTGRES_DB" \
            "$POSTGRES_USER" \
            "$OPENAI_MODEL" \
            "$REPOSITORY_URL" \
            "$TARGET_BRANCH" <<'REMOTE_SCRIPT'
          set -euo pipefail
          chmod +x /tmp/bootstrap_backend.sh
          sudo /tmp/bootstrap_backend.sh "$@"
          REMOTE_SCRIPT
