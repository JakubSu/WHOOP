name: Deploy app

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "services/api/**"
      - "compose.yml"
      - "infra/scripts/bootstrap_backend.sh"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch or commit SHA to validate, build, and deploy"
        required: false
        default: "main"

concurrency:
  group: production-app-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  resolve-release:
    name: Resolve release commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}

    steps:
      - id: release
        uses: actions/github-script@v7
        env:
          TARGET_REF: ${{ inputs.branch || github.sha }}
        with:
          script: |
            const { data } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: process.env.TARGET_REF,
            });
            core.setOutput('sha', data.sha);

  validate:
    name: Validate app
    runs-on: ubuntu-latest
    needs: resolve-release

    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix apps/web

      - name: Build frontend
        run: npm run build --prefix apps/web

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt

      - name: Install backend dependencies
        run: pip install -r services/api/requirements.txt

      - name: Run backend tests
        working-directory: services/api
        run: python manage.py test

      - name: Validate Docker Compose config
        run: docker compose --env-file compose.env.example config

  deploy:
    name: Build and deploy to EC2
    runs-on: ubuntu-latest
    needs: [resolve-release, validate]
    environment: production

    env:
      APP_DOMAIN: ${{ vars.APP_DOMAIN }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
      CADDY_ACME_EMAIL: ${{ vars.CADDY_ACME_EMAIL }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
      SSM_PARAMETER_PREFIX: ${{ vars.SSM_PARAMETER_PREFIX || '/whoop-ai-coach/prod' }}
      RELEASE_SHA: ${{ needs.resolve-release.outputs.sha }}
      ECR_WEB_REPOSITORY: whoop-ai-coach/web
      ECR_API_REPOSITORY: whoop-ai-coach/api
      IMAGE_TAG: sha-${{ needs.resolve-release.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Validate deployment configuration
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          test -n "$APP_DOMAIN"
          test -n "$CADDY_ACME_EMAIL"
          if [ -z "$AWS_ROLE_TO_ASSUME" ] && { [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; }; then
            echo "Either AWS_ROLE_TO_ASSUME or AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY must be configured." >&2
            exit 1
          fi

      - name: Configure AWS credentials with OIDC
        if: ${{ vars.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}

      - name: Configure AWS credentials with access keys
        if: ${{ vars.AWS_ROLE_TO_ASSUME == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish web image
        id: web-image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          push: true
          build-args: VITE_API_BASE_URL=/api/v1
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_WEB_REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=whoop-web
          cache-to: type=gha,mode=max,scope=whoop-web

      - name: Build and publish API image
        id: api-image
        uses: docker/build-push-action@v6
        with:
          context: ./services/api
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_API_REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=whoop-api
          cache-to: type=gha,mode=max,scope=whoop-api

      - name: Discover backend instance
        run: |
          set -euo pipefail
          mapfile -t INSTANCE_IDS < <(
            aws ec2 describe-instances \
              --region "$AWS_REGION" \
              --filters \
                "Name=tag:Name,Values=whoop-ai-coach-prod-backend" \
                "Name=tag:Project,Values=whoop-ai-coach" \
                "Name=tag:Environment,Values=prod" \
                "Name=instance-state-name,Values=running" \
              --query 'Reservations[].Instances[].InstanceId' \
              --output text | tr '\t' '\n' | sed '/^$/d'
          )

          if [ "${#INSTANCE_IDS[@]}" -ne 1 ]; then
            echo "Expected exactly one running backend instance, found ${#INSTANCE_IDS[@]}: ${INSTANCE_IDS[*]:-none}" >&2
            exit 1
          fi

          echo "EC2_INSTANCE_ID=${INSTANCE_IDS[0]}" >> "$GITHUB_ENV"

      - name: Verify SSM delivery
        run: |
          set -euo pipefail
          COMMAND_ID="$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "WHOOP SSM delivery preflight" \
            --parameters 'commands=["true"]' \
            --query 'Command.CommandId' \
            --output text)"

          for attempt in $(seq 1 12); do
            STATUS="$(aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$STATUS" in
              Success) exit 0 ;;
              Pending|InProgress|Delayed|"") sleep 5 ;;
              *)
                aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --output json || true
                exit 1
                ;;
            esac
          done

          echo "SSM delivery preflight timed out." >&2
          exit 1

      - name: Deploy immutable release with SSM Run Command
        env:
          WEB_IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_WEB_REPOSITORY }}@${{ steps.web-image.outputs.digest }}
          API_IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_API_REPOSITORY }}@${{ steps.api-image.outputs.digest }}
        run: |
          set -euo pipefail
          export SCRIPT_B64="$(base64 -w 0 infra/scripts/bootstrap_backend.sh)"
          export COMPOSE_CONFIG_B64="$(base64 -w 0 compose.yml)"

          python - <<'PY' > /tmp/ssm-commands.json
          import json
          import os
          import shlex

          args = [
              os.environ["APP_DOMAIN"],
              os.environ["CADDY_ACME_EMAIL"],
              os.environ["AWS_REGION"],
              os.environ["SSM_PARAMETER_PREFIX"],
              os.environ["OPENAI_MODEL"],
              os.environ["WEB_IMAGE"],
              os.environ["API_IMAGE"],
              os.environ["COMPOSE_CONFIG_B64"],
              os.environ["RELEASE_SHA"],
          ]
          quoted_args = " ".join(shlex.quote(arg) for arg in args)
          command = (
              "bash -lc '"
              "set -euo pipefail; "
              'script_path="/tmp/bootstrap_backend.sh"; '
              f'printf \'"\'"\'%s\'"\'"\' \'"\'"\'{os.environ["SCRIPT_B64"]}\'"\'"\' | base64 -d > "$script_path"; '
              'tr -d \'"\'"\'\\r\'"\'"\' < "$script_path" > "$script_path.unix"; '
              'chmod +x "$script_path.unix"; '
              f"sudo bash \"$script_path.unix\" {quoted_args}"
              "'"
          )
          print(json.dumps({"commands": [command]}))
          PY

          COMMAND_ID="$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy WHOOP immutable release $RELEASE_SHA" \
            --parameters file:///tmp/ssm-commands.json \
            --query 'Command.CommandId' \
            --output text)"

          echo "Started SSM command: $COMMAND_ID"
          for attempt in $(seq 1 120); do
            STATUS="$(aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$STATUS" in
              Success)
                aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --query StandardOutputContent --output text
                exit 0
                ;;
              Pending|InProgress|Delayed|"") sleep 5 ;;
              *)
                aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --output json || true
                exit 1
                ;;
            esac
          done

          echo "Timed out waiting for the immutable release command." >&2
          exit 1
