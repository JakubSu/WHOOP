x-cloudwatch-logging-options: &cloudwatch-logging-options
  awslogs-region: ${AWS_REGION:?AWS_REGION is required}
  awslogs-group: ${CLOUDWATCH_LOG_GROUP:?CLOUDWATCH_LOG_GROUP is required}
  awslogs-create-group: "false"

services:
  caddy:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    depends_on:
      - api
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:?CADDY_ACME_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        <<: *cloudwatch-logging-options
        awslogs-stream: caddy
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    depends_on:
      db:
        condition: service_healthy
    environment:
      AWS_REGION: ${AWS_REGION:?AWS_REGION is required}
      DEBUG: "false"
      SSM_PARAMETER_PREFIX: ${SSM_PARAMETER_PREFIX:?SSM_PARAMETER_PREFIX is required}
      DJANGO_ALLOWED_HOSTS: ${APP_DOMAIN:?APP_DOMAIN is required}
      CSRF_TRUSTED_ORIGINS: https://${APP_DOMAIN:?APP_DOMAIN is required}
      CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN:?APP_DOMAIN is required}
      WHOOP_FRONTEND_ALLOWED_ORIGINS: https://${APP_DOMAIN:?APP_DOMAIN is required}
      WHOOP_FRONTEND_SUCCESS_URL: https://${APP_DOMAIN:?APP_DOMAIN is required}/connect-whoop/success
      WHOOP_REDIRECT_URI: https://${APP_DOMAIN:?APP_DOMAIN is required}/api/v1/whoop/callback/
      JWT_REFRESH_COOKIE_SECURE: "true"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      COACH_RUNNER_FACTORY: ${COACH_RUNNER_FACTORY:-ai.implementations.pydantic_coach.create_pydantic_coach_runner}
      COACH_HISTORY_MAX_BATCHES: ${COACH_HISTORY_MAX_BATCHES:-12}
      COACH_HISTORY_MAX_TOKENS: ${COACH_HISTORY_MAX_TOKENS:-20000}
      COACH_MAX_MODEL_REQUESTS: ${COACH_MAX_MODEL_REQUESTS:-6}
      COACH_MAX_TOOL_CALLS: ${COACH_MAX_TOOL_CALLS:-12}
      COACH_MAX_INPUT_TOKENS: ${COACH_MAX_INPUT_TOKENS:-24000}
      COACH_MAX_OUTPUT_TOKENS: ${COACH_MAX_OUTPUT_TOKENS:-1200}
      COACH_MAX_INPUT_TOKENS_PER_REQUEST: ${COACH_MAX_INPUT_TOKENS_PER_REQUEST:-20000}
      COACH_TOOL_TIMEOUT_SECONDS: ${COACH_TOOL_TIMEOUT_SECONDS:-10}
      COACH_STREAM_KEEPALIVE_SECONDS: ${COACH_STREAM_KEEPALIVE_SECONDS:-15}
      COACH_MAX_COST_USD: ${COACH_MAX_COST_USD:?COACH_MAX_COST_USD is required}
      COACH_LOGFIRE_ENABLED: ${COACH_LOGFIRE_ENABLED:-true}
      LOGFIRE_SERVICE_NAME: ${LOGFIRE_SERVICE_NAME:-whoop-coach}
      LOGFIRE_ENVIRONMENT: ${LOGFIRE_ENVIRONMENT:-production}
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        <<: *cloudwatch-logging-options
        awslogs-stream: api

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        <<: *cloudwatch-logging-options
        awslogs-stream: db
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

secrets:
  postgres_password:
    file: ./secrets/postgres_password

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
