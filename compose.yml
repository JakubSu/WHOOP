x-cloudwatch-logging-options: &cloudwatch-logging-options
  awslogs-region: ${AWS_REGION:?AWS_REGION is required}
  awslogs-group: ${CLOUDWATCH_LOG_GROUP:?CLOUDWATCH_LOG_GROUP is required}
  awslogs-create-group: "false"

services:
  caddy:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    depends_on:
      - api
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:?CADDY_ACME_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        <<: *cloudwatch-logging-options
        awslogs-stream: caddy
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_ENV: production
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:?LOGFIRE_TOKEN is required}
      WHOOP_CLIENT_ID: ${WHOOP_CLIENT_ID:?WHOOP_CLIENT_ID is required}
      WHOOP_CLIENT_SECRET: ${WHOOP_CLIENT_SECRET:?WHOOP_CLIENT_SECRET is required}
      WHOOP_TOKEN_ENCRYPTION_KEY: ${WHOOP_TOKEN_ENCRYPTION_KEY:?WHOOP_TOKEN_ENCRYPTION_KEY is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      COACH_HISTORY_MAX_BATCHES: ${COACH_HISTORY_MAX_BATCHES:-12}
      COACH_HISTORY_MAX_TOKENS: ${COACH_HISTORY_MAX_TOKENS:-20000}
      COACH_MAX_MODEL_REQUESTS: ${COACH_MAX_MODEL_REQUESTS:-6}
      COACH_MAX_TOOL_CALLS: ${COACH_MAX_TOOL_CALLS:-12}
      COACH_MAX_INPUT_TOKENS: ${COACH_MAX_INPUT_TOKENS:-24000}
      COACH_MAX_OUTPUT_TOKENS: ${COACH_MAX_OUTPUT_TOKENS:-1200}
      COACH_MAX_INPUT_TOKENS_PER_REQUEST: ${COACH_MAX_INPUT_TOKENS_PER_REQUEST:-20000}
      COACH_TOOL_TIMEOUT_SECONDS: ${COACH_TOOL_TIMEOUT_SECONDS:-10}
      COACH_STREAM_KEEPALIVE_SECONDS: ${COACH_STREAM_KEEPALIVE_SECONDS:-15}
      COACH_MAX_COST_USD: ${COACH_MAX_COST_USD:?COACH_MAX_COST_USD is required}
      COACH_LOGFIRE_ENABLED: ${COACH_LOGFIRE_ENABLED:-true}
      COACH_LOGFIRE_CAPTURE_CONTENT: ${COACH_LOGFIRE_CAPTURE_CONTENT:-true}
      COACH_LOGFIRE_CAPTURE_BINARY_CONTENT: ${COACH_LOGFIRE_CAPTURE_BINARY_CONTENT:-true}
      COACH_LOGFIRE_CAPTURE_MODEL_REQUEST_PARAMETERS: ${COACH_LOGFIRE_CAPTURE_MODEL_REQUEST_PARAMETERS:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        <<: *cloudwatch-logging-options
        awslogs-stream: api

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: whoop_ai_coach
      POSTGRES_USER: whoop_ai_coach
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whoop_ai_coach -d whoop_ai_coach"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        <<: *cloudwatch-logging-options
        awslogs-stream: db
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

secrets:
  postgres_password:
    file: ./secrets/postgres_password

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
