x-cloudwatch-logging-options: &cloudwatch-logging-options
  awslogs-region: ${AWS_REGION:?AWS_REGION is required}
  awslogs-group: ${CLOUDWATCH_LOG_GROUP:?CLOUDWATCH_LOG_GROUP is required}
  awslogs-create-group: "false"

services:
  caddy:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    depends_on:
      - api
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:?CADDY_ACME_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        <<: *cloudwatch-logging-options
        awslogs-stream: caddy
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_ENV: production
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:?LOGFIRE_TOKEN is required}
      WHOOP_CLIENT_ID: ${WHOOP_CLIENT_ID:?WHOOP_CLIENT_ID is required}
      WHOOP_CLIENT_SECRET: ${WHOOP_CLIENT_SECRET:?WHOOP_CLIENT_SECRET is required}
      WHOOP_TOKEN_ENCRYPTION_KEY: ${WHOOP_TOKEN_ENCRYPTION_KEY:?WHOOP_TOKEN_ENCRYPTION_KEY is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      COACH_USER_MONTHLY_BUDGET_USD: ${COACH_USER_MONTHLY_BUDGET_USD:-2.00}
      COACH_GLOBAL_MONTHLY_BUDGET_USD: ${COACH_GLOBAL_MONTHLY_BUDGET_USD:-20.00}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        <<: *cloudwatch-logging-options
        awslogs-stream: api

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: whoop_ai_coach
      POSTGRES_USER: whoop_ai_coach
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whoop_ai_coach -d whoop_ai_coach"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        <<: *cloudwatch-logging-options
        awslogs-stream: db
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

secrets:
  postgres_password:
    file: ./secrets/postgres_password

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
